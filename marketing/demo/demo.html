<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hush — Demo</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Hush demo. Every phone frame is the real app UI, rendered from the app's own Compose code
   (Robolectric, frame by frame). This page only frames it: phone, captions, tap rings. */
:root{--paper:#F5F4FA;--ink:#12131A;--ink2:#454959;--muted:#7D8296;--moon:#5B67E8;--amber:#D9761C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
body.fit #stage{transform:scale(var(--fit,1));transform-origin:0 0}
#phone{position:absolute;left:300px;top:63px;width:440px;height:954px;border-radius:62px;background:#0A0B0F;padding:12px;
  box-shadow:0 60px 120px -40px rgba(30,30,70,.55),0 0 0 2px #2A2C36 inset}
#scr{position:relative;width:416px;height:930px;border-radius:50px;overflow:hidden;background:#0D1017}
#sb{height:28px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 2px;color:#E8EAF2;font-weight:600;font-size:13px}
#isl{position:absolute;left:50%;top:9px;width:90px;height:24px;margin-left:-45px;border-radius:99px;background:#000;z-index:3}
#img{display:block;width:416px;height:902px}
#ring{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.85);opacity:0;z-index:4}
.cap{position:absolute;left:880px;top:0;width:900px}
.kick{font-weight:600;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.big{font-weight:700;font-size:92px;letter-spacing:-.045em;line-height:1.02;color:var(--ink);margin-top:18px}
.sub{font-weight:500;font-size:32px;line-height:1.4;color:var(--ink2);margin-top:26px;max-width:820px}
.a{color:var(--amber)} .m{color:var(--moon)}
#note{position:absolute;left:880px;bottom:70px;font-weight:500;font-size:20px;color:var(--muted)}
#prog{position:absolute;left:880px;bottom:120px;display:flex;gap:10px}
#prog i{display:block;width:56px;height:6px;border-radius:3px;background:#E1E0EC}
#end{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <div id="phone"><div id="scr"><div id="isl"></div><div id="sb"><span>2:01</span><span id="sbr"></span></div><img id="img" alt=""><div id="ring"></div></div></div>
  <div class="cap" id="cap"><div class="kick" id="k"></div><div class="big" id="h"></div><div class="sub" id="s"></div></div>
  <div id="prog"></div>
  <div id="note">Real app UI, rendered frame by frame from Hush's own code.</div>
  <div id="end">
    <svg width="150" height="150" viewBox="0 0 108 108"><path fill="#5B67E8" d="M58,32 A22,22 0 1,0 76,66 A18,18 0 1,1 58,32 Z"/><circle cx="74" cy="38" r="5" fill="#F2994A"/></svg>
    <div style="font-weight:700;font-size:120px;letter-spacing:-.06em;color:#12131A;margin-top:6px">Hush</div>
    <div style="font-weight:600;font-size:36px;color:#454959;margin-top:10px">Free & open source · Android 10+</div>
    <div style="margin-top:44px;padding:24px 44px;border-radius:999px;background:#12131A;color:#fff;font-weight:700;font-size:40px">github.com/himanshuSri24/hush</div>
  </div>
</div>
<script>
const FPS=30, SRC=30;
let MARKS=[], APPN=0, ALERTN=0, SEQ=[], TOTAL=0, DURATION=0, END=3;
const CH={
  home:["Hush","Do Not Disturb that ~lets_the_right_people_through.","Tap the moon, pick a length. That's the whole app."],
  allowed:["Step 1 · once","Pick ~who_gets_through.","Add people by contact, starred list or number. Slack, Teams and Outlook come pre-set. Repeat callers ring too."],
  schedule:["Optional","Or let it ~run_itself.","Start from a template: weekday naps, every night, focus blocks."],
  on:["Step 2","Tap. ~Nap.","Your phone goes into Do Not Disturb, alarms only. Your alarm still rings."],
  events:["While you nap","Noise waits. ^People_ring.","Instagram and group chats are held silently. Slack and Mom got through."],
  alert:["Mom calls on WhatsApp","It ^rings, full screen.","Hush rings on the alarm channel, so Do Not Disturb can't swallow it."],
  back:["When you're up","Back? See ~what_waited.","Everything held, grouped by app. Nothing lost."],
  setup:["Setup","Every permission, ~explained.","One screen, one tap each. No account, no internet permission."],
};
const ORDER=["home","allowed","schedule","on","events","alert","back","setup"];
const $=id=>document.getElementById(id);
const inv=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const fmt=s=>s.split(" ").map(w=>w.startsWith("~")?`<span class="m">${w.slice(1).replace(/_/g," ")}</span>`:w.startsWith("^")?`<span class="a">${w.slice(1).replace(/_/g," ")}</span>`:w).join(" ");
ORDER.forEach(()=>$("prog").appendChild(document.createElement("i")));

async function init(){
  MARKS=await (await fetch("frames/app/marks.json")).json();
  const meta=await (await fetch("frames/meta.json")).json();APPN=meta.app;ALERTN=meta.alert;
  const mom=MARKS.filter(m=>m.k==="through").pop().f+18;
  SEQ=[["app",0,mom],["alert",0,ALERTN],["app",mom,APPN]];
  TOTAL=SEQ.reduce((a,[_,s,e])=>a+e-s,0);
  DURATION=TOTAL/SRC+END;window.DURATION=DURATION;
  // chapter start times on the output timeline
  const chap=[];let off=0;
  for(const [src,s,e] of SEQ){
    if(src==="alert")chap.push({t:off/SRC,id:"alert"});
    else MARKS.filter(m=>m.k==="chapter"&&m.f>=s&&m.f<e).forEach(m=>chap.push({t:(off+m.f-s)/SRC,id:m.t}));
    if(src==="app"&&s>0)chap.push({t:off/SRC,id:"events",cont:true});
    off+=e-s}
  window.CHAP=chap.sort((a,b)=>a.t-b.t);
}
function locate(t){let f=Math.min(TOTAL-1,Math.floor(t*SRC));for(const [src,s,e] of SEQ){const n=e-s;if(f<n)return [src,s+f];f-=n}return ["app",APPN-1]}
let lastSrc="";
async function render(t){
  const [src,f]=locate(t);
  const url=`frames/${src}/f${String(f).padStart(5,"0")}.png`;
  if(url!==lastSrc){const im=$("img");im.src=url;try{await im.decode()}catch(e){}lastSrc=url}
  // chapter caption with a quick rise on change
  let c=CHAP[0];for(const x of CHAP)if(t>=x.t)c=x;
  const [k,h,s]=CH[c.id];const p=inv(t,c.t,c.t+.45),e=1-Math.pow(1-p,4);
  $("k").textContent=k;$("h").innerHTML=fmt(h);$("s").textContent=s;
  $("cap").style.top=(300+(1-e)*40)+"px";$("cap").style.opacity=e;
  $("note").textContent=c.id==="events"||c.id==="alert"?"Real app UI. Notifications are simulated for this recording.":"Real app UI, rendered frame by frame from Hush's own code.";
  [...$("prog").children].forEach((el,i)=>el.style.background=ORDER.indexOf(c.id)>=i?"#5B67E8":"#E1E0EC");
  // tap ring
  const r=$("ring");r.style.opacity=0;
  if(src==="app")for(const m of MARKS){if(m.k!=="tap")continue;const d=f-m.f;if(d>=0&&d<12){const q=d/12;
    r.style.opacity=d<5?d/5*.9:.9*(1-(d-5)/7);r.style.transform=`translate(${m.x*416/784}px,${28+m.y*902/1700}px) scale(${d<5?.7+d*.06:1+(d-5)*.08})`}}
  $("sbr").textContent=src==="alert"||(c.id!=="home"&&c.id!=="allowed"&&c.id!=="schedule")?"☾  5G  78%":"5G  78%";
  // end card
  const ep=inv(t,TOTAL/SRC,TOTAL/SRC+.5);$("end").style.opacity=ep;
  $("end").style.transform=`scale(${1.04-0.04*(1-Math.pow(1-ep,3))+inv(t,TOTAL/SRC+.5,DURATION)*.015})`;
}
window.FPS=FPS;window.__ready=false;
window.seekTo=t=>render(Math.max(0,Math.min(DURATION-1/FPS,t))).then(()=>true);
document.fonts.ready.then(init).then(()=>render(0)).then(()=>{window.__ready=true});
const q=new URLSearchParams(location.search);
if(q.has("play")){document.body.classList.add("fit");document.documentElement.style.setProperty("--fit",Math.min(innerWidth/1920,innerHeight/1080));let t0=null;const loop=async ts=>{if(t0===null)t0=ts;let t=(ts-t0)/1000;if(t>DURATION){t0=ts;t=0}await render(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
</script>
</body>
</html>
