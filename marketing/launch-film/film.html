<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hush — Launch film</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Hush launch film. 1920x1080, 60fps, 30s, 120 BPM grid (cuts on x.0 / x.5).
   render(t) is a pure function of time. Persistent actors: the phone, and the amber dot
   (the one thing that gets through). */
:root{
  --paper:#F5F4FA; --ink:#12131A; --ink2:#454959; --muted:#7D8296; --line:#E3E2EE;
  --moon:#5B67E8; --moonPale:#E6E8FD; --amber:#F2994A; --amberDeep:#D9761C; --amberPale:#FFF0E0;
  --dbg:#0D1017; --dsurf:#161B25; --dhi:#1E2433; --dline:#2A3142; --dtext:#E8EAF2; --dmuted:#8B93A7; --dmoon:#9AA8FF;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
body.fit #stage{transform:scale(var(--fit,1));transform-origin:0 0}
.sc{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute;left:0;top:0}
.big{font-weight:700;letter-spacing:-.045em;color:var(--ink);line-height:1.0}
.kick{font-weight:600;font-size:22px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.a{color:var(--amberDeep)} .m{color:var(--moon)}
.w{display:inline-block;will-change:transform}
/* phone */
#phone{position:absolute;left:0;top:0;width:440px;height:900px;border-radius:64px;background:#0A0B0F;padding:12px;
  box-shadow:0 60px 120px -40px rgba(30,30,70,.55),0 0 0 2px #2A2C36 inset;transform-origin:50% 50%;z-index:10}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:var(--dbg);color:var(--dtext)}
.island{position:absolute;left:50%;top:14px;width:104px;height:30px;margin-left:-52px;border-radius:99px;background:#000;z-index:30}
.sb{position:absolute;left:0;right:0;top:0;height:58px;padding:18px 34px 0;display:flex;justify-content:space-between;font-weight:600;font-size:17px;color:var(--dtext);z-index:25}
.layer{position:absolute;inset:0;padding:70px 20px 0;visibility:hidden}
/* notification (dark, Android-ish) */
.nt{position:relative;background:var(--dsurf);border:1px solid var(--dline);border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.ic{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
.nt .ap{font-size:12px;color:var(--dmuted);font-weight:500}
.nt .ti{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
.nt .tx{font-size:14px;color:var(--dmuted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.mute{position:absolute;right:14px;top:14px;width:22px;height:22px;opacity:0}
/* app chrome */
.h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:14px 6px 2px}
.sub{font-size:14px;color:var(--dmuted);margin:0 6px 10px}
.sec{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dmuted);margin:16px 6px 8px}
.panel{background:var(--dsurf);border:1px solid var(--dline);border-radius:20px;padding:6px 14px}
.prow{display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid var(--dline)}
.prow:last-child{border-bottom:0}
.prow .n{font-size:16px;font-weight:500;flex:1}
.prow .x{color:var(--dmuted);font-size:18px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--dhi);position:relative}
.sw i{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--dmuted)}
.chip{display:grid;place-items:center;height:46px;border-radius:99px;background:var(--dsurf);font-weight:600;font-size:16px}
.pillD{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
/* touch */
.touch{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.55);z-index:28;opacity:0}
/* light-stage cards */
.card{position:absolute;left:0;top:0;background:#fff;border-radius:28px;box-shadow:0 24px 60px -24px rgba(30,30,70,.30),0 0 0 1px rgba(20,20,60,.05)}
.lnt{position:absolute;left:0;top:0;width:520px;height:96px;background:#fff;border-radius:24px;display:flex;align-items:center;gap:16px;padding:0 22px;
  box-shadow:0 20px 50px -22px rgba(30,30,70,.35),0 0 0 1px rgba(20,20,60,.05)}
.lnt .ic{width:52px;height:52px;border-radius:14px;font-size:22px}
.lnt .ti{font-weight:700;font-size:22px;color:var(--ink);white-space:nowrap}
.lnt .tx{font-weight:500;font-size:18px;color:var(--muted);white-space:nowrap;margin-top:2px}
.dot{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--amber);z-index:40}
.tile{position:absolute;left:0;top:0;width:410px;height:270px;background:#fff;border-radius:30px;padding:34px 34px;
  box-shadow:0 24px 60px -26px rgba(30,30,70,.3),0 0 0 1px rgba(20,20,60,.05)}
.tile .big{font-size:40px;letter-spacing:-.03em;line-height:1.08}
.tile .s{font-weight:500;font-size:26px;color:var(--muted);margin-top:12px;line-height:1.35}
.tile .k{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin-bottom:22px}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.022;mix-blend-mode:multiply;z-index:90;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E")}
</style>
</head>
<body>
<div id="stage"><div id="cam" style="position:absolute;inset:0;transform-origin:50% 50%">
  <div class="sc" id="s1"></div><div class="sc" id="s2"></div><div class="sc" id="s3" style="background:#0B0C12"></div>
  <div class="sc" id="s4"></div><div class="sc" id="s5"></div><div class="sc" id="s6"></div>
  <div class="sc" id="s7"></div><div class="sc" id="s8"></div><div class="sc" id="s9"></div>
  <div class="sc" id="s10"></div><div class="sc" id="s11"></div><div class="sc" id="s12"></div>
  <div class="sc" id="s13"></div>
  <div id="phone"><div class="screen" id="scr"><div class="island"></div>
    <div class="sb"><span id="clock">2:01</span><span id="sbr" style="display:flex;gap:8px;align-items:center"></span></div>
  </div></div>
  <div class="dot" id="dot"></div>
  </div><div id="grain"></div>
</div>
<script>
const FPS=60, DURATION=30;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, inv=(t,s,e)=>clamp((t-s)/(e-s),0,1), lerp=(a,b,p)=>a+(b-a)*p;
const E={o3:p=>1-Math.pow(1-p,3),o4:p=>1-Math.pow(1-p,4),ox:p=>p>=1?1:1-Math.pow(2,-10*p),i3:p=>p*p*p,i2:p=>p*p,
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, ss:p=>p*p*p*(p*(p*6-15)+10),
  back:p=>{const c=1.7;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)}};
const $=id=>document.getElementById(id);
const D=(cls,html,st)=>{const d=document.createElement("div");if(cls)d.className=cls;if(html!=null)d.innerHTML=html;if(st)d.setAttribute("style",st);return d};
function S(el,p){el.style.opacity=p.o??1;el.style.transform=`translate(${p.x||0}px,${p.y||0}px) rotate(${p.r||0}deg) scale(${p.s??1})`;
  el.style.filter=(p.b||0)>.05?`blur(${p.b.toFixed(1)}px)`:"none"}
function scene(id,t,a,b){const el=$(id),on=t>=a&&t<b;el.style.visibility=on?"visible":"hidden";return on}
function words(text,cls,style,parent){const el=D(cls,null,style);el.__w=text.split(" ").map(w=>{
  if(w==="/"){el.appendChild(document.createElement("br"));return null}
  const m=D("",null,"display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em;margin-right:.24em");
  const s=D("w");if(w.startsWith("^")){s.className="w a";w=w.slice(1)}else if(w.startsWith("~")){s.className="w m";w=w.slice(1)}
  s.innerHTML=w.replace(/_/g," ");m.appendChild(s);el.appendChild(m);return s}).filter(Boolean);parent.appendChild(el);return el}
function rise(el,t,a,o={}){const st=o.stag??.05,d=o.dur??.45;el.__w.forEach((w,i)=>{const p=E.ox(inv(t,a+i*st,a+i*st+d));let y=(1-p)*110,op=p;
  if(o.out!=null){const q=E.i3(inv(t,o.out+i*.015,o.out+i*.015+.22));y-=q*110;op*=1-q}w.style.transform=`translateY(${y}%)`;w.style.opacity=op})}
/* icons */
const MOON=(c="#9AA8FF",s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="M12.5 3A9 9 0 1 0 21 15 7 7 0 1 1 12.5 3Z"/></svg>`;
const BELLX=`<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#8B93A7" d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2Z"/><path d="M3 3l18 18" stroke="#0D1017" stroke-width="4"/><path d="M3 3l18 18" stroke="#8B93A7" stroke-width="2"/></svg>`;
const PHONE_I=(c="#fff",s=26)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path fill="${c}" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.24.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>`;
const APPS={

  am:["a","#232F3E","Amazon"], wa:["W","#25D366","WhatsApp"], sl:["S","#4A154B","Slack"], te:["T","#5059C9","Teams"], ou:["O","#0F6CBD","Outlook"],
  ms:["M","#1A73E8","Messages"], ph:["☎","#34A853","Phone"],
};
const ic=(k,st="")=>`<div class="ic" style="background:${APPS[k][1]};${st}">${APPS[k][0]}</div>`;
const nt=(k,title,text,extra="")=>`<div class="nt" ${extra}>${ic(k)}<div><div class="ap">${APPS[k][2]} · now</div><div class="ti">${title}</div><div class="tx">${text}</div></div><div class="mute">${BELLX}</div></div>`;

const B={};
(function build(){

    <div id="lockN">${[
      nt("ig","rahul.k liked your reel","and 41 others"),

  // missed calls
  B.miss=L("Lmiss",`<div style="text-align:center;margin:30px 0 26px"><div style="font-size:84px;font-weight:300;letter-spacing:-.04em">2:31</div><div style="color:#8B93A7;font-size:17px">Do Not Disturb was on</div></div>
    ${[["2:04"],["2:06"],["2:09"],["2:15"]].map(([tm])=>`<div class="nt">${ic("ph")}<div><div class="ap">Phone · ${tm} PM</div><div class="ti">Mom ★</div><div class="tx">Missed call</div></div></div>`).join("")}`);
  B.missN=[...B.miss.querySelectorAll(".nt")];
  // allowed screen
  const appRow=(k)=>`<div class="prow">${ic(k,"width:38px;height:38px;border-radius:11px")}<div class="n">${APPS[k][2]}</div><div class="x">✕</div></div>`;
  B.allow=L("Lallow",`<div class="h1">Allowed</div><div class="sub">These always reach you.</div>
    <div class="sec">PEOPLE</div><div class="panel" id="ppl">
      <div class="prow" id="pMom"><div class="av" style="background:#3A2C1C;color:#FFB86B">M</div><div class="n">Mom</div><div class="x">✕</div></div>
      <div class="prow" id="pMgr"><div class="av" style="background:#2A3160;color:#9AA8FF">AK</div><div class="n">Arjun (manager)</div><div class="x">✕</div></div>

    <div class="sec">APPS</div><div class="panel" id="apps">${appRow("sl")}${appRow("te")}${appRow("ou")}</div>
    <div class="sec">ALSO LET THROUGH</div><div class="panel"><div class="prow"><div style="font-size:20px;color:#9AA8FF;width:38px;text-align:center">↻</div><div class="n">Repeat callers<div style="font-size:12px;color:#8B93A7">Called twice within 15 min</div></div><div class="sw" id="rsw"><i></i></div></div></div>`);
  B.pRows=[$("pMom"),$("pMgr")]; B.aRows=[...B.allow.querySelectorAll("#apps .prow")];
  // now screen
  B.now=L("Lnow",`<div class="h1" style="display:flex;justify-content:space-between;align-items:center">Hush<span id="onPill" class="pillD" style="background:#9AA8FF;color:#0D1017;opacity:0">ON</span></div>
    <div class="sub" id="nowSub">Good afternoon. Nap time?</div>
    <div style="position:relative;width:300px;height:300px;margin:26px auto 0" id="ringBox">

        <circle cx="150" cy="150" r="145" fill="url(#rg)"/><circle cx="150" cy="150" r="140" fill="none" stroke="#1E2433" stroke-width="10"/>
        <circle id="arc" cx="150" cy="150" r="140" fill="none" stroke="#9AA8FF" stroke-width="10" stroke-linecap="round" stroke-dasharray="879.6" stroke-dashoffset="879.6" transform="rotate(-90 150 150)"/></svg>

    <div style="position:relative;text-align:center;padding-top:40px"><span class="pillD" style="background:#3A2C1C;color:#FFB86B;font-size:14px;padding:6px 14px">Got through Hush</span></div>

  B.k2=D("kick","Built-in DND · starred contacts","position:absolute;left:156px;top:270px");$("s2").appendChild(B.k2);

  $("s4").appendChild(lg);B.logo=lg;B.cres=lg.querySelector("#crescent");
  B.word=words("Hush","big","position:absolute;left:880px;top:345px;font-size:200px;letter-spacing:-.06em",$("s4"));
  B.tag=words("Silence everything. ^Except_who_matters.","","position:absolute;left:0;right:0;top:640px;text-align:center;font-weight:600;font-size:46px;letter-spacing:-.02em;color:#454959",$("s4"));
  // ---- S5 make the rule

  B.h5=words("Pick who / ^always gets through.","big","position:absolute;left:874px;top:350px;font-size:104px",$("s5"));
  B.s5=D("","Your people, on calls, SMS and WhatsApp. Plus Slack, Teams and Outlook.","position:absolute;left:880px;top:610px;width:820px;font-weight:500;font-size:30px;line-height:1.4;color:#454959");$("s5").appendChild(B.s5);
  // ---- S6
  B.h6=words("Tap. / ~Nap.","big","position:absolute;left:1240px;top:340px;font-size:170px",$("s6"));
  B.h6l=words("Step 2","kick","position:absolute;left:150px;top:420px",$("s6"));
  B.h6s=D("","30 min, an hour, until a time, or on a schedule.","position:absolute;left:150px;top:470px;width:470px;font-weight:500;font-size:32px;line-height:1.35;color:#454959");$("s6").appendChild(B.h6s);
  // ---- S7 noise absorbed

    S(B.cta,{x:960-410,y:640+(1-c)*40,o:inv(t,27.75,27.95),s:lerp(.94,1,c)});
    // gentle drift so the end card is not frozen
    const dr=inv(t,28.2,30);B.cta.style.transform+=` scale(${1+dr*.015})`;
  }

  /* camera: every scene keeps moving (push-in + drift), reset on each cut */
  const CUTS=[0,2.5,4.5,5,6.5,9.5,11.5,14,16.5,19.5,22,24.5,27,30];
  let ci=0;while(ci<CUTS.length-2&&t>=CUTS[ci+1])ci++;
  const cs=1.025+.025*Math.sin(t*.42-1.2);

  else P.style.visibility="hidden";

  else d.style.visibility="hidden";
  window.__f=f;
}
